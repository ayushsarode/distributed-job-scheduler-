syntax = "proto3";
package credential.service.exiro.ai.v1;
option go_package = "exiro.ai/application/models/pb";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

service CredentialService {
  rpc SetCredential(SetCredentialRequest) returns (SetCredentialResponse);
  rpc GetCredential(GetCredentialRequest) returns (GetCredentialResponse);
  rpc DeleteCredential(DeleteCredentialRequest) returns (google.protobuf.Empty);
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse);
}

// ===== Credential Management =====

message SetCredentialRequest {
  string credential_name = 1;  // User-defined name (e.g., "production-twilio", "campaign-1")
  Credential credential = 2;
  CredentialMetadata credential_metadata = 3;
  CredentialType credential_type = 4;
}

message SetCredentialResponse {
  string credential_id = 1;
  string credential_name = 2;
  CredentialType credential_type = 3;
  string created_by = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message GetCredentialRequest {
  string credential_id = 1;
}

message GetCredentialResponse {
  string credential_id = 1;
  string credential_name = 2;
  CredentialType type = 3;
  CredentialMetadata credential_metadata = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message DeleteCredentialRequest {
  string credential_id = 1;
}

message ListCredentialsRequest {
  repeated CredentialType type = 1;  // Optional: filter by type, if unspecified returns all
  int32 limit = 2;
  int32 offset = 3;
}

message ListCredentialsResponse {
  repeated GetCredentialResponse credentials = 1;
}

// ===== Credential Message (used for SetCredential & internal storage) =====

message Credential {
  oneof credential {
    TwilioCredential twilio = 1;
    ExotelCredential exotel = 2;
    // Future: GoogleCredential google = 3;
  }
}

message TwilioCredential {
  string account_sid = 1;
  string auth_token = 2;              // SECRET
  string from_phone_number = 3;
}

message ExotelCredential {
  string account_sid = 1;
  string api_key = 2;
  string api_token = 3;               // SECRET
  string voice_bot_app_id = 4;
  string from_phone_number = 5;
}

// ===== Provider-Specific Metadata. Secrets not included in message =====

message CredentialMetadata {
  oneof credential_metadata {
    TwilioCredentialMetadata twilio = 1;
    ExotelCredentialMetadata exotel = 2;
  }
}

message TwilioCredentialMetadata {
  string account_sid = 1;
  string from_phone_number = 2;
}

message ExotelCredentialMetadata {
  string account_sid = 1;
  string api_key = 2;
  string voice_bot_app_id = 3;
  string from_phone_number = 4;
}

// ===== Enums =====

enum CredentialType {
  CREDENTIAL_TYPE_UNSPECIFIED = 0;
  TWILIO = 1;
  EXOTEL = 2;
  // Future: GOOGLE = 3, VONAGE = 4, etc.
}
